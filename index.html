 const title=(candidate?.name||name).replace(/^PSG$/i,'Paris Saint-Germain F.C.').replace(/^Barcelona$/i,'FC Barcelona').replace(/^Manchester City$/i,'Manchester City F.C.').replace(/^Manchester United$/i,'Manchester United F.C.').replace(/^Liverpool$/i,'Liverpool F.C.').replace(/^Arsenal$/i,'Arsenal F.C.').replace(/^Chelsea$/i,'Chelsea F.C.').replace(/^Tottenham$/i,'Tottenham Hotspur F.C.').replace(/^Bayern Munich$/i,'FC Bayern Munich').replace(/^Real Madrid$/i,'Real Madrid CF').replace(/^Inter Milan$/i,'Inter Milan').replace(/^AC Milan$/i,'AC Milan');
 try{
  const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=240&titles='+encodeURIComponent(title);
  const r=await fetch(u);if(r.ok){let j=await r.json();let pages=Object.values(j.query?.pages||{});let img=pages.find(p=>p.thumbnail?.source)?.thumbnail.source;if(img)return img}
 }catch{}
 try{
  const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(name+' football club')+'&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=240';
  const r=await fetch(u);if(r.ok){let j=await r.json();let pages=Object.values(j.query?.pages||{});let p=pages.find(p=>p.thumbnail?.source&&/(football|f\.c\.|soccer|club|madrid|barcelona)/i.test(p.title));if(p)return p.thumbnail.source}
 }catch{}
 return '';
}

function shootout(m){let p=m?.penalty;if(Array.isArray(p))return p;if(p&&typeof p==='object'){let a=p.home??p.hs,b=p.away??p.as;if(Number.isInteger(+a)&&Number.isInteger(+b))return [+a,+b]}return null}
function winnerId(m){if(!finished(m))return null;if(m.hs!==m.as)return m.hs>m.as?m.home:m.away;let p=shootout(m);return p&&p[0]!==p[1]?(p[0]>p[1]?m.home:m.away):null}
function eligibleTeams(r){let eliminated=new Set(),qualified=new Set();for(let m of data.fixtures){if(matchRound(m)>=r)continue;let w=winnerId(m);if(w===null)continue;eliminated.add(w===m.home?m.away:m.home);if(matchRound(m)===r-1)qualified.add(w)}let pool=data.teams.filter(t=>!eliminated.has(t.id));if(r>0){let previous=data.fixtures.filter(m=>matchRound(m)===r-1);if(previous.length){let participants=new Set(previous.flatMap(m=>[m.home,m.away]));pool=pool.filter(t=>qualified.has(t.id)||!participants.has(t.id))}}return pool.sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}))}
function opts(selected,allowBlank=false,r=0){let pool=eligibleTeams(r);if(selected!=null&&!pool.some(t=>t.id===selected)&&team(selected))pool=[...pool,team(selected)].sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));return (allowBlank?'<option value="">Choose club</option>':'')+pool.map(t=>'<option value="'+t.id+'" '+(t.id===selected?'selected':'')+'>'+esc(t.name)+'</option>').join('')}

function drawBracketLines(){const tree=$('.bracket-tree');if(!tree)return;tree.querySelector('.bracket-lines')?.remove();const cols=[...tree.querySelectorAll('.bracket-column')];const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','bracket-lines');svg.setAttribute('width',tree.scrollWidth);svg.setAttribute('height',tree.scrollHeight);const base=tree.getBoundingClientRect();for(let i=0;i<cols.length-1;i++){const left=[...cols[i].querySelectorAll('.bracket-match')],right=[...cols[i+1].querySelectorAll('.bracket-match')];if(!left.length||!right.length)continue;const x1=cols[i].getBoundingClientRect().right-base.left,x2=cols[i+1].getBoundingClientRect().left-base.left,mid=(x1+x2)/2;const centers=left.map(e=>{let r=e.getBoundingClientRect();return r.top+r.height/2-base.top});for(let j=0;j<left.length;j++){let y=centers[j];let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+x1+' '+y+' H '+mid);p.setAttribute('stroke','#9276f9');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');svg.appendChild(p)}for(let j=0;j<right.length;j++){let r=right[j].getBoundingClientRect(),y=r.top+r.height/2-base.top;let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+mid+' '+y+' H '+x2);p.setAttribute('stroke','#6178bb');p.setAttribute('stroke-width','2');p.setAttribute('stroke-dasharray','4 5');p.setAttribute('fill','none');svg.appendChild(p)}for(let j=0;j<centers.length-1;j+=2){let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+mid+' '+centers[j]+' V '+centers[j+1]);p.setAttribute('stroke','#9276f9');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');svg.appendChild(p)}}tree.prepend(svg)}

function addTeam(name,logo=''){name=name.trim();if(!name||data.teams.length>=64||data.teams.some(t=>norm(t.name)===norm(name)))return false;data.teams.push({id:data.nextId++,name,owner:-1,logo});return true}
function parseMatch(id){let m=data.fixtures.find(m=>String(m.id)===String(id));if(!m)throw Error('Fixture not found');let h=$('[data-home="'+id+'"]')?.value,w=$('[data-away="'+id+'"]')?.value;if(!h||!w||h===w)throw Error('Select two different clubs');let hs=$('[data-hs="'+id+'"]')?.value.trim(),as=$('[data-as="'+id+'"]')?.value.trim();if((hs===''||as==='')&&hs!==as)throw Error('Enter both scores or leave both blank');if(hs!==''&&(!/^\d+$/.test(hs)||!/^\d+$/.test(as)))throw Error('Scores must be whole nonnegative numbers');let home=+h,away=+w;let homeOwner=+$('[data-match-owner-home="'+id+'"]').value,awayOwner=+$('[data-match-owner-away="'+id+'"]') .value;let open=$('[data-penalty="'+id+'"]')?.style.display!=='none',ph=$('[data-ph="'+id+'"]')?.value.trim()||'',pa=$('[data-pa="'+id+'"]')?.value.trim()||'';let penalty=null;if(open){if(hs===''||as===''||hs!==as)throw Error('Penalties require a tied match score');if(!/^\d+$/.test(ph)||!/^\d+$/.test(pa)||+ph===+pa)throw Error('Enter different nonnegative whole-number penalty scores');penalty=[+ph,+pa]}return {m,home,away,homeOwner,awayOwner,hs:hs===''?null:+hs,as:as===''?null:+as,penalty,penaltyEnabled:open}}
function storeMatch(id){let x=parseMatch(id);snapshot();let oldHome=x.m.home,oldAway=x.m.away;x.m.home=x.home;x.m.away=x.away;x.m.hs=x.hs;x.m.as=x.as;x.m.penalty=x.penalty;x.m.penaltyEnabled=x.penaltyEnabled;x.m.homeOwner=x.homeOwner;x.m.awayOwner=x.awayOwner;commit('Fixture saved successfully')}
async function searchClubs(){let q=$('#clubSearch')?.value.trim();if(!q)return;searchQuery=q;searchResults=ranked(q,catalog);render();try{let response=await fetch('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t='+encodeURIComponent(q));if(response.ok){let j=await response.json(),extra=(j.teams||[]).filter(t=>t.strTeam).map(t=>({name:t.strTeam,country:t.strCountry||'',logo:t.strBadge||t.strLogo||'',aliases:[]}));let enriched=searchResults.map(c=>{let hit=extra.find(x=>norm(x.name)===norm(c.name)||norm(x.name).includes(norm(c.name))||norm(c.name).includes(norm(x.name)));return hit?{...c,logo:hit.logo||c.logo}:c});let seen=new Set();searchResults=[...enriched,...ranked(q,extra)].filter(c=>{let k=norm(c.name);if(seen.has(k))return false;seen.add(k);return true}).slice(0,20);if(tab==='Teams')render()}}catch{}}

if(a==='searchClubs'){await searchClubs();return}
if(a==='refreshCrests'){b.disabled=true;b.textContent='Searching for crests…';let n=await resolveCrests(data.teams.map(t=>t.id));notice=n+' crest(s) found. Others may need a manual logo URL.';render();return}
if(a==='selectClub'){let c=searchResults[+b.dataset.index];if(!c||!addTeam(c.name,c.logo||''))throw Error('Club already added or 64-team limit reached');let id=data.teams[data.teams.length-1].id;commit('Club added · looking up crest');if(!c.logo)resolveCrests([id]);return}
if(a==='addTeam'||a==='bulkTeams'){snapshot();let names=a==='addTeam'?[$('#newTeam').value]:$('#bulkTeams').value.split(/[\n,]+/);let n=names.filter(x=>addTeam(x)).length;if(!n)throw Error('No new clubs added');let ids=data.teams.slice(-n).map(t=>t.id);commit(n+' club(s) added · loading crests');resolveCrests(ids);return}
if(a==='deleteTeam'){let id=+b.dataset.id;if(data.fixtures.some(m=>m.home===id||m.away===id))throw Error('Delete fixtures involving this club first');if(!confirm('Delete this club?'))return;snapshot();data.teams=data.teams.filter(t=>t.id!==id);commit('Club deleted');return}
if(a==='addFixture'){let home=+$('#fixtureHome').value,away=+$('#fixtureAway').value;if(!team(home)||!team(away)||home===away)throw Error('Choose two different clubs');let r=+$('#fixtureRound').value;if(!eligibleTeams(r).some(t=>t.id===home)||!eligibleTeams(r).some(t=>t.id===away))throw Error('An eliminated club cannot enter this round');if(data.fixtures.filter(m=>matchRound(m)===r).length>=[32,16,8,4,2,1][r])throw Error('This round already has its maximum number of fixtures');snapshot();data.fixtures.push({id:data.nextId++,round:r,home,away,homeOwner:+$('#fixtureHomeOwner').value,awayOwner:+$('#fixtureAwayOwner').value,hs:null,as:null});fixtureRound=r;fixtureFilter=r;commit('Fixture added to '+ROUNDS[r]);return}

if(a==='editFixture'){let m=data.fixtures.find(m=>String(m.id)===b.dataset.id);if(m){fixtureFilter=matchRound(m);tab='Fixtures';render();setTimeout(()=>document.querySelector('[data-hs="'+m.id+'"]')?.scrollIntoView({behavior:'smooth',block:'center'}),50)}return}
if(a==='deleteFixture'){if(!confirm('Delete fixture?'))return;snapshot();data.fixtures=data.fixtures.filter(m=>String(m.id)!==b.dataset.id);commit('Fixture deleted');return}
if(a==='editRound'){let m=data.fixtures.find(m=>String(m.id)===b.dataset.id);let answer=prompt('Move fixture to round (1=64, 2=32, 3=16, 4=QF, 5=SF, 6=Final)',String(matchRound(m)+1));if(answer===null)return;let n=+answer;if(!Number.isInteger(n)||n<1||n>6)throw Error('Enter a number from 1 to 6');snapshot();m.round=n-1;commit('Round updated');return}
if(a==='gotoAdd'){fixtureRound=+b.dataset.round;fixtureFilter=fixtureRound;tab='Fixtures';render();return}

if(a==='undo'){if(!undo)return;let old=JSON.stringify(data);data=JSON.parse(undo);undo=old;commit('Last change undone');return}
if(a==='archive'){if(!data.fixtures.length&&!data.teams.length)throw Error('Nothing to archive');if(!confirm('Archive this tournament and start a new one?'))return;snapshot();let archive={date:new Date().toLocaleDateString(),teams:data.teams,fixtures:data.fixtures,names:data.names,points:data.points};let archives=[...data.archives,archive];data={...empty(),names:data.names,archives};commit('Tournament archived');return}
if(a==='viewArchive'){showArchive=showArchive===+b.dataset.index?-1:+b.dataset.index;render();return}
if(a==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='rivalry-fc-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return}
if(a==='import'){$('#importFile').click();return}
if(a==='resetAll'){if(!confirm('Permanently delete all local tournament data, including archives?'))return;snapshot();data=empty();commit('Tournament reset');return}
}catch(e){alert(e.message)}}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;notice='';render()}else if(b.dataset.round!==undefined&&b.dataset.act!=='gotoAdd'){round=+b.dataset.round;render()}else if(b.dataset.act)act(b)});
document.addEventListener('change',e=>{let x=e.target;try{if(x.id==='fixtureRound'){fixtureRound=+x.value;let html=opts(null,true,fixtureRound);$('#fixtureHome').innerHTML=html;$('#fixtureAway').innerHTML=html;return}if(x.id==='fixtureHome'||x.id==='fixtureAway'){let side=x.id==='fixtureHome'?'Home':'Away',sel=$('#fixture'+side+'Owner');if(sel)sel.value=String(owner(+x.value));return}if(x.dataset.owner!==undefined){snapshot();team(+x.dataset.owner).owner=+x.value;commit('Club owner updated')}else if(x.dataset.logo!==undefined){let v=x.value.trim();if(v&&!/^https:\/\//i.test(v))throw Error('Logo must use HTTPS');snapshot();team(+x.dataset.logo).logo=v;commit('Logo saved')}else if(x.dataset.name!==undefined){if(!x.value.trim())throw Error('Enter a name');snapshot();data.names[+x.dataset.name]=x.value.trim();commit('Player name saved')}}catch(err){alert(err.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='clubSearch'){e.preventDefault();searchClubs()}});
$('#importFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.teams)||!Array.isArray(d.fixtures)||!Array.isArray(d.points))throw Error('Invalid backup');if(confirm('Replace current data with backup?')){snapshot();data=d;data.archives??=[];commit('Backup imported')}}catch(err){alert(err.message)}e.target.value=''});
// Migrate legacy knockout fixtures into round-tagged matches, preserving saved results.
if(Array.isArray(data.bracket)){let added=0;data.bracket.forEach((rr,r)=>rr.forEach(m=>{if(m.home!=null&&m.away!=null&&!data.fixtures.some(f=>f.home===m.home&&f.away===m.away&&f.hs===m.hs&&f.as===m.as)){data.fixtures.push({id:data.nextId++,round:r,home:m.home,away:m.away,hs:m.hs,as:m.as,homeOwner:owner(m.home),awayOwner:owner(m.away),penalty:m.penalty??null});added++}}));data.bracket=null;if(added)save()}
data.fixtures.forEach(m=>{if(!Number.isInteger(m.round))m.round=0;if(!Number.isInteger(m.homeOwner))m.homeOwner=owner(m.home);if(!Number.isInteger(m.awayOwner))m.awayOwner=owner(m.away)});save();render();
})();</script></body></html>
