(()=>{
'use strict';
const KEY='rivalry-fc-final-v1',ROUNDS=['Round of 64','Round of 32','Round of 16','Quarterfinals','Semifinals','Final'];
const empty=()=>({version:3,names:['Parsa','Samyar'],teams:[],fixtures:[],bracket:null,points:[0,0],nextId:1,archives:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||empty()}catch{data=empty()}
if(!data||!Array.isArray(data.teams)||!Array.isArray(data.fixtures))data=empty();
data.names=Array.isArray(data.names)&&data.names.length===2?data.names:['Parsa','Samyar'];data.points=Array.isArray(data.points)?data.points:[0,0];data.archives=Array.isArray(data.archives)?data.archives:[];
let tab='Overview',round=0,searchResults=[],searchQuery='',notice='',undo=null,fixtureRound=0,showArchive=-1;
const $=q=>document.querySelector(q),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const team=id=>data.teams.find(t=>t.id===id),owner=id=>team(id)?.owner??-1,finished=m=>m&&team(m.home)&&team(m.away)&&Number.isInteger(m.hs)&&Number.isInteger(m.as);
function save(){try{const v=JSON.stringify(data);localStorage.setItem(KEY,v);if(localStorage.getItem(KEY)!==v)throw Error();return true}catch{alert('Saving failed. Export a backup immediately.');return false}}
function snapshot(){undo=JSON.stringify(data)}
function commit(msg){if(save()){notice=msg||'Saved on this device';render()}}
function allMatches(){let ms=data.fixtures.slice();if(Array.isArray(data.bracket))data.bracket.forEach((rr,r)=>rr.forEach((m,i)=>{if(m.home!=null&&m.away!=null&&!ms.some(x=>x.home===m.home&&x.away===m.away&&x.hs===m.hs&&x.as===m.as))ms.push({...m,round:r,id:'old-'+r+'-'+i})}));return ms}
function matchRound(m){return Number.isInteger(m.round)?Math.min(5,Math.max(0,m.round)):0}
function playerOf(m,side){let stored=side==='home'?m.homeOwner:m.awayOwner;return Number.isInteger(stored)?stored:owner(m[side])}
function metrics(){let players=[0,1].map(()=>({played:0,w:0,d:0,l:0,gf:0,ga:0,clean:0,streak:0,best:0,form:[],rounds:ROUNDS.map(()=>0),trend:[]}));let clubs=new Map(data.teams.map(t=>[t.id,{id:t.id,played:0,w:0,d:0,l:0,gf:0,ga:0,clean:0}]));let completed=allMatches().filter(finished);completed.forEach(m=>{let h=playerOf(m,'home'),a=playerOf(m,'away'),r=matchRound(m);for(let [side,other,p,op] of [['home','away',h,a],['away','home',a,h]]){let goals=side==='home'?m.hs:m.as,against=side==='home'?m.as:m.hs,won=goals>against,lost=goals<against;let c=clubs.get(m[side]);if(c){c.played++;c.gf+=goals;c.ga+=against;c.w+=+won;c.l+=+lost;c.d+=+(goals===against);c.clean+=+(against===0)}if(p===0||p===1){let x=players[p];x.played++;x.gf+=goals;x.ga+=against;x.w+=+won;x.l+=+lost;x.d+=+(goals===against);x.clean+=+(against===0);x.rounds[r]+=goals;x.form.push(won?'W':lost?'L':'D');x.streak=won?x.streak+1:0;x.best=Math.max(x.best,x.streak);x.trend.push(x.gf)}}});return {players,clubs:[...clubs.values()],completed}}
const known={'barcelona':'FC Barcelona (crest).svg','real madrid':'Real Madrid CF.svg','manchester united':'Manchester United FC crest.svg','manchester city':'Manchester City FC badge.svg','liverpool':'Liverpool FC.svg','arsenal':'Arsenal FC.svg','chelsea':'Chelsea FC.svg','tottenham':'Tottenham Hotspur.svg','bayern munich':'FC Bayern München logo (2017).svg','borussia dortmund':'Borussia Dortmund logo.svg','psg':'Paris Saint-Germain F.C..svg','juventus':'Juventus FC - logo black (Italy, 2020).svg','inter milan':'FC Internazionale Milano 2021.svg','ac milan':'AC Milan.svg','napoli':'SSC Napoli.svg','bayer leverkusen':'Bayer 04 Leverkusen logo.svg','rb leipzig':'RB Leipzig 2014 logo.svg','roma':'AS Roma logo (2017).svg','lazio':'S.S. Lazio badge.svg','galatasaray':'Galatasaray Sports Club Logo.svg','fenerbahce':'Fenerbahçe SK.svg','inter miami':'Inter Miami CF logo.svg','flamengo':'Flamengo braz logo.svg','palmeiras':'Palmeiras logo.svg','river plate':'Escudo del Club Atlético River Plate.svg','boca juniors':'Boca Juniors logo.svg'};
const catalog=[
['Barcelona','barca,barsa,fc barcelona,barça','Spain'],['Real Madrid','madrid,real madrid cf,rm','Spain'],['Atlético Madrid','atletico,atleti,athletico madrid','Spain'],['Sevilla','sevilla fc','Spain'],['Real Betis','betis','Spain'],['Real Sociedad','sociedad','Spain'],['Villarreal','villarreal cf','Spain'],['Valencia','valencia cf','Spain'],['Athletic Bilbao','athletic club,bilbao','Spain'],['Girona','girona fc','Spain'],['Manchester City','man city,mcfc,city','England'],['Manchester United','man utd,man u,united,manchester utd','England'],['Liverpool','liverpool fc,lfc','England'],['Arsenal','arsenal fc,gunners','England'],['Chelsea','chelsea fc','England'],['Tottenham','spurs,tottenham hotspur','England'],['Newcastle United','newcastle','England'],['Aston Villa','villa','England'],['Brighton','brighton and hove albion','England'],['West Ham','west ham united','England'],['Crystal Palace','palace','England'],['Everton','everton fc','England'],['Nottingham Forest','forest','England'],['Wolves','wolverhampton wanderers','England'],['Fulham','fulham fc','England'],['Bournemouth','afc bournemouth','England'],['Leicester City','leicester','England'],['Leeds United','leeds','England'],['Sunderland','sunderland afc','England'],['Bayern Munich','bayern,fc bayern,bayern münchen','Germany'],['Borussia Dortmund','dortmund,bvb','Germany'],['Bayer Leverkusen','leverkusen,bayer 04','Germany'],['RB Leipzig','leipzig,rbl','Germany'],['Eintracht Frankfurt','frankfurt','Germany'],['Stuttgart','vfb stuttgart','Germany'],['Wolfsburg','vfl wolfsburg','Germany'],['Borussia Mönchengladbach','gladbach,monchengladbach','Germany'],['Inter Milan','inter,internazionale,inter milano','Italy'],['AC Milan','milan,rossoneri','Italy'],['Juventus','juve,juventus fc','Italy'],['Napoli','ssc napoli','Italy'],['Roma','as roma','Italy'],['Lazio','ss lazio','Italy'],['Atalanta','atalanta bc','Italy'],['Fiorentina','acf fiorentina','Italy'],['Bologna','bologna fc','Italy'],['Torino','torino fc','Italy'],['PSG','paris saint germain,paris,paris sg','France'],['Marseille','olympique marseille,om','France'],['Lyon','olympique lyonnais,ol','France'],['Monaco','as monaco','France'],['Lille','losc lille','France'],['Nice','ogc nice','France'],['Lens','rc lens','France'],['Benfica','sl benfica','Portugal'],['Porto','fc porto','Portugal'],['Sporting CP','sporting lisbon,sporting','Portugal'],['Braga','sc braga','Portugal'],['Ajax','afc ajax','Netherlands'],['PSV','psv eindhoven','Netherlands'],['Feyenoord','feyenoord rotterdam','Netherlands'],['AZ Alkmaar','az','Netherlands'],['Galatasaray','gala,gs','Turkey'],['Fenerbahce','fenerbahçe,fener','Turkey'],['Besiktas','beşiktaş,besiktas jk','Turkey'],['Trabzonspor','trabzon','Turkey'],['Celtic','celtic fc','Scotland'],['Rangers','rangers fc','Scotland'],['Club Brugge','brugge','Belgium'],['Anderlecht','rsc anderlecht','Belgium'],['Shakhtar Donetsk','shakhtar','Ukraine'],['Dynamo Kyiv','dynamo kiev','Ukraine'],['Red Star Belgrade','crvena zvezda,red star','Serbia'],['Dinamo Zagreb','dinamo','Croatia'],['Olympiacos','olympiacos','Greece'],['Panathinaikos','pao','Greece'],['Al Nassr','al-nassr,al nasr','Saudi Arabia'],['Al Hilal','al-hilal,hilal','Saudi Arabia'],['Al Ittihad','al-ittihad,ittihad','Saudi Arabia'],['Al Ahli','al-ahli','Saudi Arabia'],['Inter Miami','miami,inter miami cf','USA'],['LA Galaxy','galaxy,los angeles galaxy','USA'],['LAFC','los angeles fc','USA'],['Atlanta United','atlanta united fc,atl utd','USA'],['Seattle Sounders','sounders','USA'],['Columbus Crew','crew','USA'],['Flamengo','cr flamengo','Brazil'],['Palmeiras','se palmeiras','Brazil'],['Santos','santos fc','Brazil'],['Corinthians','sc corinthians','Brazil'],['São Paulo','sao paulo,spfc','Brazil'],['Fluminense','flu','Brazil'],['Botafogo','botafogo fr','Brazil'],['Grêmio','gremio','Brazil'],['Internacional','sc internacional','Brazil'],['River Plate','river,ca river plate','Argentina'],['Boca Juniors','boca,ca boca juniors','Argentina'],['Racing Club','racing','Argentina'],['Independiente','ca independiente','Argentina'],['Al Ahly','al-ahly cairo,alahly','Egypt'],['Zamalek','zamalek sc','Egypt'],['Wydad Casablanca','wydad','Morocco'],['Raja Casablanca','raja','Morocco'],['Persepolis','perspolis','Iran'],['Esteghlal','esteghlal fc','Iran'],['Sepahan','sepahan sc','Iran'],['Urawa Red Diamonds','urawa reds','Japan'],['Vissel Kobe','kobe','Japan'],['Kawasaki Frontale','frontale','Japan'],['Ulsan HD','ulsan hyundai','South Korea'],['Jeonbuk Hyundai Motors','jeonbuk','South Korea']
].map(([name,aliases,country])=>({name,aliases:aliases.split(','),country}));
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function dist(a,b){let x=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let y=[i];for(let j=1;j<=b.length;j++)y[j]=Math.min(y[j-1]+1,x[j]+1,x[j-1]+(a[i-1]===b[j-1]?0:1));x=y}return x[b.length]}
function ranked(q,items){let n=norm(q);if(!n)return [];return items.map(c=>{let keys=[c.name,...(c.aliases||[])].map(norm);let score=Math.max(...keys.map(k=>k===n?100:k.startsWith(n)?85:k.includes(n)?70:k.split(' ').some(w=>w.startsWith(n))?65:Math.max(0,55-dist(k,n)*10)));return {...c,score}}).filter(c=>c.score>=25).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)).slice(0,20)}
function crestUrl(t){if(!t)return '';if(t.logo)return t.logo;let k=norm(t.name),file=known[k]||known[t.name.toLowerCase()];return file?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file)+'?width=100':''}
function crest(t){let url=crestUrl(t),name=esc(t?.name||'?');return url?'<img class="crest" src="'+esc(url)+'" alt="'+name+' crest" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><span class="fallback" style="display:none">'+esc((t?.name||'?').slice(0,2).toUpperCase())+'</span>':'<span class="fallback">'+esc((t?.name||'?').slice(0,2).toUpperCase())+'</span>'}
function teamUI(id){let t=team(id);return '<span class="team">'+crest(t)+'<span><strong class="teamname">'+esc(t?.name||'TBD')+'</strong><span class="small muted" style="display:block">'+esc(owner(id)<0?'Unassigned':data.names[owner(id)])+'</span></span></span>'}
function opts(selected,allowBlank=false){return (allowBlank?'<option value="">Choose club</option>':'')+data.teams.map(t=>'<option value="'+t.id+'" '+(t.id===selected?'selected':'')+'>'+esc(t.name)+'</option>').join('')}
function roundOpts(selected){return ROUNDS.map((r,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+r+'</option>').join('')}
function card(m){let id=m.id,score=finished(m),label=ROUNDS[matchRound(m)];return '<article class="card"><div class="flex between"><span class="tag">'+label+'</span><span class="small '+(score?'winner':'muted')+'">'+(score?'Finished':'Awaiting result')+'</span></div><div class="row" style="margin:13px 0"><select data-home="'+id+'">'+opts(m.home,true)+'</select><select data-away="'+id+'">'+opts(m.away,true)+'</select></div><div class="flex between" style="margin-bottom:12px">'+teamUI(m.home)+'<span class="muted">VS</span>'+teamUI(m.away)+'</div><div class="flex"><input type="number" min="0" step="1" placeholder="Home" aria-label="Home goals" data-hs="'+id+'" value="'+(m.hs??'')+'"><span>–</span><input type="number" min="0" step="1" placeholder="Away" aria-label="Away goals" data-as="'+id+'" value="'+(m.as??'')+'"></div><div class="flex wrap" style="margin-top:12px"><button class="primary" data-act="saveMatch" data-id="'+id+'">Save result</button><button data-act="editRound" data-id="'+id+'">Change round</button><button class="danger" data-act="deleteFixture" data-id="'+id+'">Delete</button></div></article>'}
function statTile(label,value){return '<div class="card"><div class="small muted">'+esc(label)+'</div><div class="big">'+esc(value)+'</div></div>'}
function statsTable(rows){return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>'+rows[0].map(x=>'<th style="padding:9px;text-align:left;border-bottom:1px solid #354361">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+row.map(x=>'<td style="padding:9px;border-bottom:1px solid #293653">'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){const M=metrics(),P=M.players,done=M.completed;$('#tabs').innerHTML=['Overview','Teams','Fixtures','Knockout','Points','Stats','History','Settings'].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'">'+t+'</button>').join('');let h=notice?'<div class="notice" role="status">'+esc(notice)+'</div>':'';if(undo)h+='<button style="margin-bottom:12px" data-act="undo">↶ Undo last change</button>';
if(tab==='Overview'){let champ=data.fixtures.find(m=>matchRound(m)===5&&finished(m));let champId=champ?(champ.hs>champ.as?champ.home:champ.as>champ.hs?champ.away:null):null;h+='<h2 class="heading">⚽ Goals leaderboard</h2><div class="grid">'+data.names.map((n,i)=>statTile(n+' · Goals',P[i].gf)).join('')+'</div><h2 class="heading">⭐ Custom points</h2><div class="grid">'+data.names.map((n,i)=>statTile(n+' · Points',Number(data.points[i]||0).toFixed(1))).join('')+'</div><div class="card"><h3>🏆 Tournament progress</h3>'+ROUNDS.map((r,i)=>'<div class="flex between" style="padding:7px 0"><span>'+r+'</span><strong>'+data.fixtures.filter(m=>matchRound(m)===i&&finished(m)).length+' / '+data.fixtures.filter(m=>matchRound(m)===i).length+' played</strong></div>').join('')+'<button class="primary" data-tab="Knockout">View rounds</button></div>'+(champId?'<div class="card"><h2>🏆 Champion!</h2>'+teamUI(champId)+'</div>':'')+'<div class="card"><h3>Next matches</h3>'+(data.fixtures.filter(m=>!finished(m)).slice(0,3).map(m=>'<div style="padding:8px 0">'+esc(ROUNDS[matchRound(m)])+' · '+esc(team(m.home)?.name||'TBD')+' vs '+esc(team(m.away)?.name||'TBD')+'</div>').join('')||'<p class="muted">No pending fixtures</p>')+'</div>'}
if(tab==='Teams'){h+='<h2 class="heading">Clubs ('+data.teams.length+'/64)</h2><div class="card"><label>Search clubs (aliases, partial names and typos)</label><div class="flex"><input id="clubSearch" value="'+esc(searchQuery)+'" placeholder="Try Barca, Barsa, Man U, Inter..."><button class="primary" data-act="searchClubs">Search</button></div><div id="results">'+searchResults.map((c,i)=>'<div class="flex between" style="padding:10px 0;border-bottom:1px solid #34445e"><div class="team">'+crest(c)+'<span>'+esc(c.name)+'<span class="small muted" style="display:block">'+esc(c.country||'')+'</span></span></div><button data-act="selectClub" data-index="'+i+'">Add</button></div>').join('')+'</div><div class="divider"></div><label>Or add a custom club</label><div class="flex"><input id="newTeam" placeholder="Club name"><button data-act="addTeam">Add</button></div><label style="margin-top:12px">Bulk add (one per line)</label><textarea id="bulkTeams" rows="3" placeholder="Club A&#10;Club B"></textarea><button data-act="bulkTeams">Add all</button></div><div class="matchgrid">'+data.teams.map(t=>'<div class="card"><div class="flex between">'+teamUI(t.id)+'<button class="danger" data-act="deleteTeam" data-id="'+t.id+'">×</button></div><label>Assigned player</label><select data-owner="'+t.id+'"><option value="-1">Unassigned</option>'+data.names.map((n,i)=>'<option value="'+i+'" '+(t.owner===i?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select><label style="margin-top:9px">Logo URL override</label><input data-logo="'+t.id+'" value="'+esc(t.logo||'')+'" placeholder="https://..."></div>').join('')+'</div>'}
if(tab==='Fixtures'){h+='<h2 class="heading">Add FIFA fixture</h2><div class="card"><label>Round</label><select id="fixtureRound">'+roundOpts(fixtureRound)+'</select><div class="row" style="margin-top:12px"><div><label>Home</label><select id="fixtureHome">'+opts(null,true)+'</select></div><div><label>Away</label><select id="fixtureAway">'+opts(null,true)+'</select></div></div><button class="primary" style="margin-top:12px" data-act="addFixture">+ Add fixture</button><p class="small muted">You decide every matchup. No random draws or automatic opponent assignment.</p></div><h2 class="heading">Fixtures ('+data.fixtures.length+')</h2><div class="matchgrid">'+data.fixtures.map(card).join('')+'</div>'}
if(tab==='Knockout'){h+='<h2 class="heading">🏆 Knockout rounds</h2><div class="roundnav">'+ROUNDS.map((r,i)=>'<button data-round="'+i+'" class="'+(round===i?'active':'')+'">'+r+'</button>').join('')+'</div><div class="card"><strong>'+ROUNDS[round]+'</strong><p class="muted small">Fixtures appear here as soon as you add them. Future opponents remain unknown until you enter them.</p><button data-act="gotoAdd" data-round="'+round+'">+ Add fixture to this round</button></div><div class="matchgrid">'+data.fixtures.filter(m=>matchRound(m)===round).map(card).join('')+'</div>'+(data.fixtures.some(m=>matchRound(m)===round)?'':'<div class="empty">No fixtures entered for this round yet.</div>')}
if(tab==='Points'){h+='<h2 class="heading">⭐ Manual points</h2><p class="muted">Separate from goals. Adjust in half-point increments.</p>'+data.names.map((n,i)=>'<div class="card"><div class="flex between"><strong>'+esc(n)+'</strong><span class="big">'+Number(data.points[i]||0).toFixed(1)+'</span></div><div class="flex wrap">'+[-1,-.5,.5,1].map(v=>'<button data-act="points" data-person="'+i+'" data-delta="'+v+'">'+(v>0?'+':'')+v+'</button>').join('')+'</div></div>').join('')}
if(tab==='Stats'){let total=done.reduce((a,m)=>a+m.hs+m.as,0),high=[...done].sort((a,b)=>(b.hs+b.as)-(a.hs+a.as))[0],big=[...done].sort((a,b)=>Math.abs(b.hs-b.as)-Math.abs(a.hs-a.as))[0];h+='<h2 class="heading">📊 Tournament analytics</h2><div class="grid">'+statTile('Matches played',done.length)+statTile('Total goals',total)+statTile('Goals / match',done.length?(total/done.length).toFixed(2):'0')+statTile('Clubs',data.teams.length)+statTile('Draws',done.filter(m=>m.hs===m.as).length)+statTile('Fixtures scheduled',data.fixtures.length)+'</div><h3>Player comparison</h3><div class="card">'+statsTable([['Metric',...data.names],...['played','w','d','l','gf','ga','clean','best'].map(k=>[({played:'Matches',w:'Wins',d:'Draws',l:'Losses',gf:'Goals for',ga:'Goals against',clean:'Clean sheets',best:'Longest win streak'})[k],...P.map(p=>p[k])]),['Goal difference',...P.map(p=>p.gf-p.ga)],['Win %',...P.map(p=>p.played?(100*p.w/p.played).toFixed(1)+'%':'0%')],['Goals / game',...P.map(p=>p.played?(p.gf/p.played).toFixed(2):'0')],['Conceded / game',...P.map(p=>p.played?(p.ga/p.played).toFixed(2):'0')],['Recent form',...P.map(p=>p.form.slice(-5).join('–')||'—')]])+'</div><h3>Goals by round</h3><div class="card">'+statsTable([['Round',...data.names],...ROUNDS.map((r,i)=>[r,...P.map(p=>p.rounds[i])])])+'</div><h3>Club rankings</h3><div class="card">'+statsTable([['Club','P','W','D','L','GF','GA','GD','Win %'],...M.clubs.filter(c=>c.played).sort((a,b)=>b.w-a.w||b.gf-a.gf).map(c=>[team(c.id)?.name,c.played,c.w,c.d,c.l,c.gf,c.ga,c.gf-c.ga,(100*c.w/c.played).toFixed(0)+'%'])])+'</div><div class="card"><h3>🔥 Highest scoring</h3><p>'+esc(high?team(high.home)?.name+' '+high.hs+'–'+high.as+' '+team(high.away)?.name:'No completed matches')+'</p><h3>⚡ Biggest victory</h3><p>'+esc(big?team(big.home)?.name+' '+big.hs+'–'+big.as+' '+team(big.away)?.name:'No completed matches')+'</p></div>'}
if(tab==='History'){h+='<h2 class="heading">Tournament history</h2><div class="card"><p class="muted">Archive the current tournament, then start fresh while preserving its summary and results.</p><button class="primary" data-act="archive">Archive & start new tournament</button></div>'+data.archives.map((a,i)=>'<div class="card"><div class="flex between"><strong>'+esc(a.date||'Past tournament')+'</strong><span class="tag">'+(a.fixtures?.length||0)+' fixtures</span></div><p class="muted">'+esc(a.teams?.length||0)+' clubs · '+esc(a.names?.join(' vs ')||'')+'</p><button data-act="viewArchive" data-index="'+i+'">View summary</button>'+(showArchive===i?'<div class="notice">Completed: '+(a.fixtures||[]).filter(finished).length+' · Total goals: '+(a.fixtures||[]).reduce((sum,m)=>sum+(Number.isInteger(m.hs)&&Number.isInteger(m.as)?m.hs+m.as:0),0)+'</div>':'')+'</div>').join('')}
if(tab==='Settings'){h+='<h2 class="heading">Settings & backup</h2><div class="card">'+data.names.map((n,i)=>'<label>Player '+(i+1)+'</label><input data-name="'+i+'" value="'+esc(n)+'" style="margin-bottom:12px">').join('')+'</div><div class="card"><h3>💾 Backups</h3><p class="muted">Scores save locally on this phone. Automatic syncing between different phones requires a connected database and is not enabled.</p><button class="primary" data-act="export">Export JSON</button> <button data-act="import">Import JSON</button></div><div class="card"><button class="danger" data-act="resetAll">Delete all local tournament data</button></div>'}
$('#main').innerHTML=h}
function addTeam(name,logo=''){name=name.trim();if(!name||data.teams.length>=64||data.teams.some(t=>norm(t.name)===norm(name)))return false;data.teams.push({id:data.nextId++,name,owner:-1,logo});return true}
function parseMatch(id){let m=data.fixtures.find(m=>String(m.id)===String(id));if(!m)throw Error('Fixture not found');let h=$('[data-home="'+id+'"]')?.value,w=$('[data-away="'+id+'"]')?.value;if(!h||!w||h===w)throw Error('Select two different clubs');let hs=$('[data-hs="'+id+'"]')?.value.trim(),as=$('[data-as="'+id+'"]')?.value.trim();if((hs===''||as==='')&&hs!==as)throw Error('Enter both scores or leave both blank');if(hs!==''&&(!/^\d+$/.test(hs)||!/^\d+$/.test(as)))throw Error('Scores must be whole nonnegative numbers');let home=+h,away=+w;return {m,home,away,hs:hs===''?null:+hs,as:as===''?null:+as}}
function storeMatch(id){let x=parseMatch(id);snapshot();let oldHome=x.m.home,oldAway=x.m.away;x.m.home=x.home;x.m.away=x.away;x.m.hs=x.hs;x.m.as=x.as;if(oldHome!==x.home||oldAway!==x.away||!Number.isInteger(x.m.homeOwner)){x.m.homeOwner=owner(x.home);x.m.awayOwner=owner(x.away)}commit('Fixture saved successfully')}
async function searchClubs(){let q=$('#clubSearch')?.value.trim();if(!q)return;searchQuery=q;searchResults=ranked(q,catalog);render();try{let response=await fetch('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t='+encodeURIComponent(q));if(response.ok){let j=await response.json(),extra=(j.teams||[]).filter(t=>t.strTeam).map(t=>({name:t.strTeam,country:t.strCountry||'',logo:t.strBadge||t.strLogo||'',aliases:[]}));let seen=new Set();searchResults=[...searchResults,...ranked(q,extra)].filter(c=>{let k=norm(c.name);if(seen.has(k))return false;seen.add(k);return true}).slice(0,20);if(tab==='Teams')render()}}catch{}}
async function act(b){let a=b.dataset.act;try{
if(a==='searchClubs'){await searchClubs();return}
if(a==='selectClub'){let c=searchResults[+b.dataset.index];if(!c||!addTeam(c.name,c.logo||''))throw Error('Club already added or 64-team limit reached');snapshotAfterAdd();commit('Club added');return}
if(a==='addTeam'||a==='bulkTeams'){snapshot();let names=a==='addTeam'?[$('#newTeam').value]:$('#bulkTeams').value.split(/[\n,]+/);let n=names.filter(x=>addTeam(x)).length;if(!n)throw Error('No new clubs added');commit(n+' club(s) added');return}
if(a==='deleteTeam'){let id=+b.dataset.id;if(data.fixtures.some(m=>m.home===id||m.away===id))throw Error('Delete fixtures involving this club first');if(!confirm('Delete this club?'))return;snapshot();data.teams=data.teams.filter(t=>t.id!==id);commit('Club deleted');return}
if(a==='addFixture'){let home=+$('#fixtureHome').value,away=+$('#fixtureAway').value;if(!team(home)||!team(away)||home===away)throw Error('Choose two different clubs');let r=+$('#fixtureRound').value;if(data.fixtures.filter(m=>matchRound(m)===r).length>=[32,16,8,4,2,1][r])throw Error('This round already has its maximum number of fixtures');snapshot();data.fixtures.push({id:data.nextId++,round:r,home,away,homeOwner:owner(home),awayOwner:owner(away),hs:null,as:null});fixtureRound=r;commit('Fixture added to '+ROUNDS[r]);return}
if(a==='saveMatch'){storeMatch(b.dataset.id);return}
if(a==='deleteFixture'){if(!confirm('Delete fixture?'))return;snapshot();data.fixtures=data.fixtures.filter(m=>String(m.id)!==b.dataset.id);commit('Fixture deleted');return}
if(a==='editRound'){let m=data.fixtures.find(m=>String(m.id)===b.dataset.id);let answer=prompt('Move fixture to round (1=64, 2=32, 3=16, 4=QF, 5=SF, 6=Final)',String(matchRound(m)+1));if(answer===null)return;let n=+answer;if(!Number.isInteger(n)||n<1||n>6)throw Error('Enter a number from 1 to 6');snapshot();m.round=n-1;commit('Round updated');return}
if(a==='gotoAdd'){fixtureRound=+b.dataset.round;tab='Fixtures';render();return}
if(a==='points'){snapshot();data.points[+b.dataset.person]=Math.round((Number(data.points[+b.dataset.person]||0)+Number(b.dataset.delta))*2)/2;commit('Points updated');return}
if(a==='undo'){if(!undo)return;let old=JSON.stringify(data);data=JSON.parse(undo);undo=old;commit('Last change undone');return}
if(a==='archive'){if(!data.fixtures.length&&!data.teams.length)throw Error('Nothing to archive');if(!confirm('Archive this tournament and start a new one?'))return;snapshot();let archive={date:new Date().toLocaleDateString(),teams:data.teams,fixtures:data.fixtures,names:data.names,points:data.points};let archives=[...data.archives,archive];data={...empty(),names:data.names,archives};commit('Tournament archived');return}
if(a==='viewArchive'){showArchive=showArchive===+b.dataset.index?-1:+b.dataset.index;render();return}
if(a==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='rivalry-fc-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return}
if(a==='import'){$('#importFile').click();return}
if(a==='resetAll'){if(!confirm('Permanently delete all local tournament data, including archives?'))return;snapshot();data=empty();commit('Tournament reset');return}
}catch(e){alert(e.message)}}
function snapshotAfterAdd(){/* Keep newly selected club; next actions remain undoable. */}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;notice='';render()}else if(b.dataset.round!==undefined&&b.dataset.act!=='gotoAdd'){round=+b.dataset.round;render()}else if(b.dataset.act)act(b)});
document.addEventListener('change',e=>{let x=e.target;try{if(x.id==='fixtureRound'){fixtureRound=+x.value;return}if(x.dataset.owner!==undefined){snapshot();team(+x.dataset.owner).owner=+x.value;commit('Club owner updated')}else if(x.dataset.logo!==undefined){let v=x.value.trim();if(v&&!/^https:\/\//i.test(v))throw Error('Logo must use HTTPS');snapshot();team(+x.dataset.logo).logo=v;commit('Logo saved')}else if(x.dataset.name!==undefined){if(!x.value.trim())throw Error('Enter a name');snapshot();data.names[+x.dataset.name]=x.value.trim();commit('Player name saved')}else if(x.dataset.hs!==undefined||x.dataset.as!==undefined){let id=x.dataset.hs??x.dataset.as;let h=$('[data-hs="'+id+'"]')?.value.trim(),a=$('[data-as="'+id+'"]')?.value.trim();if((h!==''&&a!=='')||(h===''&&a===''))storeMatch(id)}}catch(err){alert(err.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='clubSearch'){e.preventDefault();searchClubs()}});
$('#importFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.teams)||!Array.isArray(d.fixtures)||!Array.isArray(d.points))throw Error('Invalid backup');if(confirm('Replace current data with backup?')){snapshot();data=d;data.archives??=[];commit('Backup imported')}}catch(err){alert(err.message)}e.target.value=''});
// Migrate legacy knockout fixtures into round-tagged matches, preserving saved results.
if(Array.isArray(data.bracket)){let added=0;data.bracket.forEach((rr,r)=>rr.forEach(m=>{if(m.home!=null&&m.away!=null&&!data.fixtures.some(f=>f.home===m.home&&f.away===m.away&&f.hs===m.hs&&f.as===m.as)){data.fixtures.push({id:data.nextId++,round:r,home:m.home,away:m.away,hs:m.hs,as:m.as,homeOwner:owner(m.home),awayOwner:owner(m.away),penalty:m.penalty??null});added++}}));data.bracket=null;if(added)save()}
data.fixtures.forEach(m=>{if(!Number.isInteger(m.round))m.round=0;if(!Number.isInteger(m.homeOwner))m.homeOwner=owner(m.home);if(!Number.isInteger(m.awayOwner))m.awayOwner=owner(m.away)});save();render();
})();</script></body></html>
