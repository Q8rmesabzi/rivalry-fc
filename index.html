:root{color-scheme:dark;--bg:#090e1c;--panel:#141d30;--line:#293653;--muted:#9caac4;--text:#f4f6ff;--violet:#8c70ff;--green:#54e4b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c2250 0,#090e1c 40%);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#27334f;color:var(--text);padding:10px 13px;border-radius:11px;font-weight:700}button.primary{background:linear-gradient(120deg,#7b61f6,#4d82e8);border-color:transparent}button.danger{background:#472437;color:#ffd8e2}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{background:#0d1628;border:1px solid #3a4b69;color:white;padding:11px;border-radius:10px;min-width:0;width:100%}input[type=number]{max-width:100%}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.app{max-width:1080px;margin:auto;padding:0 14px 80px}.hero{padding:30px 4px 17px}.eyebrow{letter-spacing:2px;font-size:11px;font-weight:850;color:#c4b7ff}.hero h1{font-size:clamp(27px,6vw,42px);margin:6px 0;letter-spacing:-1px}.hero p{color:var(--muted);margin:0}.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 0 17px;position:sticky;top:0;background:#0b1121f0;backdrop-filter:blur(15px);z-index:5}.tabs button{white-space:nowrap;font-size:13px}.tabs button.active{background:var(--violet);color:#0b0e20;border-color:var(--violet)}.card{background:linear-gradient(155deg,#172239,#121b2d);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 8px 26px #00000016}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:35px;font-weight:850;letter-spacing:-1px}.heading{font-size:20px;font-weight:800;margin:7px 0 15px}.crest{width:38px;height:38px;object-fit:contain;flex:none}.fallback{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(140deg,#4e59a8,#24345a);font-weight:900;font-size:11px;flex:none}.team{display:flex;align-items:center;gap:10px;min-width:0}.teamname{overflow-wrap:anywhere;font-weight:750}.tag{font-size:11px;border-radius:99px;background:#2b3356;padding:5px 9px;color:#d0c7ff}.score{font-size:24px;font-weight:850}.roundnav{display:flex;gap:6px;overflow-x:auto;margin:0 0 15px}.roundnav button{white-space:nowrap}.roundnav button.active{background:#7963ee}.matchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}.matchgrid .card{margin:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.matchteam{display:flex;align-items:center;gap:9px;min-width:0}.matchteam .crest,.matchteam .fallback{width:32px;height:32px}.notice{background:#2c2943;border:1px solid #4c426d;border-radius:12px;padding:12px;margin:10px 0;color:#e4dfff;font-size:13px}.divider{border-top:1px solid var(--line);margin:14px 0}.empty{text-align:center;color:var(--muted);padding:25px}.section{margin-bottom:22px}.winner{color:var(--green)}.footer{color:#71829f;text-align:center;font-size:12px;margin:35px 0}@media(min-width:720px){.hero{padding-top:45px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two>.card{margin:0}}@media(max-width:430px){.card{padding:13px}.grid{gap:8px}.big{font-size:29px}.tabs button{padding:9px 11px}}
</style></head><body><div class="app"><header class="hero"><div class="eyebrow">⚽ RIVALRY FC · 2026</div><h1>Road to Glory 🏆</h1><p>Parsa vs Samyar · 64-team knockout tournament</p></header><nav class="tabs" id="tabs"></nav><main id="main"></main><footer class="footer">Rivalry FC · Scores stay on this device · Export backups regularly</footer></div><input type="file" id="importFile" accept="application/json,.json" hidden><script>
(()=>{'use strict';const key='rivalry-fc-final-v1',roundNames=['Round of 64','Round of 32','Round of 16','Quarterfinals','Semifinals','Final'];const initial=()=>({version:1,names:['Parsa','Samyar'],teams:[],fixtures:[],bracket:null,points:[0,0],nextId:1});let data;try{data=JSON.parse(localStorage.getItem(key))||initial()}catch{data=initial()}if(!Array.isArray(data.teams)||!Array.isArray(data.fixtures)||!Array.isArray(data.points)||!Array.isArray(data.names))data=initial();let tab='Overview',round=0,clubResults=[];const main=document.querySelector('#main'),tabs=document.querySelector('#tabs');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const T=id=>data.teams.find(t=>t.id===id);const owner=id=>T(id)?.owner??-1;const complete=m=>m&&m.home!=null&&m.away!=null&&Number.isInteger(m.hs)&&Number.isInteger(m.as);const matches=()=>[...data.fixtures,...(data.bracket?data.bracket.flat():[])].filter(complete);const goals=()=>{let g=[0,0];matches().forEach(m=>{let a=owner(m.home),b=owner(m.away);if(a>=0)g[a]+=m.hs;if(b>=0)g[b]+=m.as});return g};function persist(){try{localStorage.setItem(key,JSON.stringify(data));if(localStorage.getItem(key)!==JSON.stringify(data))throw Error('Verification failed');return true}catch{alert('Saving failed. Export a backup immediately.');return false}}
// Club crests: Wikimedia Commons Special:FilePath resolves common club filenames; fallback is always visible if unavailable.
const known={'barcelona':'FC Barcelona (crest).svg','fc barcelona':'FC Barcelona (crest).svg','real madrid':'Real Madrid CF.svg','real madrid cf':'Real Madrid CF.svg','manchester united':'Manchester United FC crest.svg','manchester city':'Manchester City FC badge.svg','liverpool':'Liverpool FC.svg','liverpool fc':'Liverpool FC.svg','arsenal':'Arsenal FC.svg','chelsea':'Chelsea FC.svg','tottenham':'Tottenham Hotspur.svg','bayern munich':'FC Bayern München logo (2017).svg','bayern münchen':'FC Bayern München logo (2017).svg','borussia dortmund':'Borussia Dortmund logo.svg','psg':'Paris Saint-Germain F.C..svg','paris saint germain':'Paris Saint-Germain F.C..svg','juventus':'Juventus FC - logo black (Italy, 2020).svg','inter milan':'FC Internazionale Milano 2021.svg','ac milan':'AC Milan.svg','napoli':'SSC Napoli 2024.svg','atletico madrid':'Atlético Madrid logo.svg','ajax':'Ajax Amsterdam.svg','benfica':'SL Benfica logo.svg','porto':'FC Porto.svg','sporting':'Sporting Clube de Portugal (Logo).svg','celtic':'Celtic FC.svg','rangers':'Rangers FC.svg','newcastle':'Newcastle United Logo.svg','aston villa':'Aston Villa logo.svg','brighton':'Brighton & Hove Albion logo.svg','leverkusen':'Bayer 04 Leverkusen logo.svg','rb leipzig':'RB Leipzig 2014 logo.svg','roma':'AS Roma logo (2017).svg','lazio':'S.S. Lazio badge.svg','fiorentina':'ACF Fiorentina logo.svg','galatasaray':'Galatasaray Sports Club Logo.svg','fenerbahce':'Fenerbahçe SK.svg','al nassr':'Al Nassr FC Logo.svg','al hilal':'Al Hilal SFC Logo.svg','inter miami':'Inter Miami CF logo.svg','flamengo':'Flamengo braz logo.svg','palmeiras':'Palmeiras logo.svg','river plate':'Escudo del Club Atlético River Plate.svg','boca juniors':'Boca Juniors logo.svg'};
function crestUrl(t){if(!t)return '';if(t.logo)return t.logo;let name=known[t.name.toLowerCase().trim()];return name?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(name)+'?width=100':''}function crest(t){if(!t)return '<span class="fallback">?</span>';let src=crestUrl(t),letters=esc(t.name.slice(0,2).toUpperCase());return src?`<img class="crest" src="${esc(src)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'${letters}'}))">`:`<span class="fallback">${letters}</span>`}function team(id){let t=T(id);return `<span class="team">${crest(t)}<span><span class="teamname">${esc(t?.name||'TBD')}</span><span class="muted small" style="display:block">${owner(id)<0?'Unassigned':esc(data.names[owner(id)])}</span></span></span>`}function opts(selected){return data.teams.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.name)}</option>`).join('')}function winner(m){if(!complete(m))return null;if(m.hs!==m.as)return m.hs>m.as?m.home:m.away;return m.penalty===0?m.home:m.penalty===1?m.away:null}function propagate(){if(!data.bracket)return;for(let r=1;r<6;r++)for(let i=0;i<data.bracket[r].length;i++){let m=data.bracket[r][i],h=winner(data.bracket[r-1][i*2]),a=winner(data.bracket[r-1][i*2+1]);if(m.home!==h||m.away!==a)Object.assign(m,{home:h,away:a,hs:null,as:null,penalty:null})}}
function matchCard(m,mode,r=0,i=0){let k=mode==='knockout'?`k-${r}-${i}`:`f-${m.id}`,editable=mode==='knockout'&&r===0;return `<article class="card"><div class="flex between"><span class="tag">${mode==='knockout'?'Match '+(i+1):'Fixture #'+m.id}</span><span class="small ${winner(m)!=null?'winner':'muted'}">${complete(m)?mode==='knockout'?'Result saved':'Played':'Not played'}</span></div>${editable?`<div class="row" style="margin-top:13px"><select data-home="${k}">${opts(m.home)}</select><select data-away="${k}">${opts(m.away)}</select></div>`:mode==='fixture'?`<div class="row" style="margin-top:13px"><select data-home="${k}">${opts(m.home)}</select><select data-away="${k}">${opts(m.away)}</select></div>`:''}<div class="row" style="margin:14px 0">${team(m.home)}${team(m.away)}</div><div class="flex"><input aria-label="Home score" type="number" min="0" step="1" data-hs="${k}" placeholder="Home goals" value="${m.hs??''}"><span style="font-size:20px">–</span><input aria-label="Away score" type="number" min="0" step="1" data-as="${k}" placeholder="Away goals" value="${m.as??''}"></div>${mode==='knockout'?`<div style="margin-top:10px"><label>Penalty winner (only if tied)</label><select data-pen="${k}"><option value="">No penalty winner</option><option value="0" ${m.penalty===0?'selected':''}>${esc(T(m.home)?.name||'Home')} wins</option><option value="1" ${m.penalty===1?'selected':''}>${esc(T(m.away)?.name||'Away')} wins</option></select></div>`:''}<div class="flex" style="margin-top:12px"><button class="primary" data-action="saveMatch" data-mode="${mode}" data-round="${r}" data-index="${i}" data-id="${m.id??''}">Save result</button>${mode==='fixture'?`<button class="danger" data-action="deleteFixture" data-id="${m.id}">Delete</button>`:''}</div></article>`}
function render(){tabs.innerHTML=['Overview','Teams','Fixtures','Knockout','Points','Stats','Settings'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');let html='',g=goals();if(tab==='Overview'){let champ=data.bracket?winner(data.bracket[5][0]):null;html=`<h2 class="heading">⚽ Goals leaderboard</h2><div class="grid">${data.names.map((n,i)=>`<div class="card"><div class="muted">${esc(n)}</div><div class="big">${g[i]}</div><div class="small muted">Goals scored</div></div>`).join('')}</div><h2 class="heading">⭐ Custom points</h2><div class="grid">${data.names.map((n,i)=>`<div class="card"><div class="muted">${esc(n)}</div><div class="big">${Number(data.points[i]).toFixed(1)}</div><div class="small muted">Manually awarded</div></div>`).join('')}</div><div class="card"><h3>🏆 Knockout tournament</h3>${champ?`<div class="flex">${team(champ)}<strong class="winner">CHAMPION</strong></div>`:data.bracket?roundNames.map((n,i)=>`<div class="flex between" style="padding:6px 0"><span class="muted">${n}</span><strong>${data.bracket[i].filter(m=>winner(m)!=null).length} / ${data.bracket[i].length}</strong></div>`).join(''):'<p class="muted">Add 64 teams to generate the knockout bracket.</p>'}<button class="primary" data-tab="Knockout">Open knockout →</button></div>`}
if(tab==='Teams')html=`<h2 class="heading">Clubs <span class="muted">(${data.teams.length}/64)</span></h2><div class="card"><label>Add a club</label><div class="flex"><input id="newTeam" placeholder="e.g. FC Barcelona"><button class="primary" data-action="addTeam">Add</button></div><div class="divider"></div><label>Search real clubs and crests</label><div class="flex"><input id="clubSearch" placeholder="Search e.g. Barcelona, Napoli, Boca Juniors"><button class="primary" data-action="searchClubs">Search</button></div><div id="clubResults" style="margin-top:10px">${clubResults.length?clubResults.map((c,i)=>`<div class="flex between" style="padding:8px 0;border-bottom:1px solid #34445e"><span class="flex">${c.logo?`<img src="${esc(c.logo)}" style="width:32px;height:32px;object-fit:contain" alt="">`:``}<span>${esc(c.name)}<span class="small muted" style="display:block">${esc(c.country||"")}</span></span></span><button data-action="selectClub" data-index="${i}">Add club</button></div>`).join(""):"<p class=\"small muted\">Search uses an online football club database. If unavailable, add a club manually.</p>"}</div><div class="divider"></div><label>Or add several at once (one per line)</label><textarea id="bulkTeams" rows="4" placeholder="Real Madrid\nBarcelona\nLiverpool"></textarea><button style="margin-top:10px" data-action="bulkTeams">Add all</button><p class="small muted">Popular clubs get automatic logo matching where available. For others, add your own image URL.</p></div><div class="matchgrid">${data.teams.map(t=>`<div class="card"><div class="flex between">${team(t.id)}<button class="danger" data-action="deleteTeam" data-id="${t.id}">×</button></div><div class="divider"></div><label>Assigned to</label><select data-owner="${t.id}"><option value="-1" ${t.owner===-1?'selected':''}>Unassigned</option>${data.names.map((n,i)=>`<option value="${i}" ${t.owner===i?'selected':''}>${esc(n)}</option>`).join('')}</select><label style="margin-top:11px">Logo image URL (optional override)</label><input data-logo="${t.id}" placeholder="https://.../logo.png" value="${esc(t.logo||'')}"></div>`).join('')}</div>`;
if(tab==='Fixtures')html=`<h2 class="heading">Custom fixtures</h2><div class="card"><div class="row"><div><label>Home team</label><select id="fixtureHome">${opts(data.teams[0]?.id)}</select></div><div><label>Away team</label><select id="fixtureAway">${opts(data.teams[1]?.id)}</select></div></div><button class="primary" style="margin-top:12px" data-action="addFixture">+ Add match</button></div><div class="matchgrid">${data.fixtures.map(m=>matchCard(m,'fixture')).join('')}</div>${data.fixtures.length?'':'<div class="empty">No custom matches yet.</div>'}`;
if(tab==='Knockout')html=`<h2 class="heading">🏆 64-team knockout</h2>${!data.bracket?`<div class="card"><p>Six rounds. 63 matches. One champion.</p><p class="muted">Add exactly 64 teams to create the bracket. You can customize every Round of 64 matchup before entering scores.</p><button class="primary" data-action="createBracket" ${data.teams.length!==64?'disabled':''}>Create bracket (${data.teams.length}/64 teams)</button></div>`:`<div class="roundnav">${roundNames.map((n,i)=>`<button class="${i===round?'active':''}" data-round="${i}">${n}</button>`).join('')}</div><div class="card flex between"><strong>${roundNames[round]}</strong><span class="tag">${data.bracket[round].filter(m=>winner(m)!=null).length}/${data.bracket[round].length} decided</span></div><div class="matchgrid">${data.bracket[round].map((m,i)=>matchCard(m,'knockout',round,i)).join('')}</div><div class="card" style="margin-top:16px"><button class="danger" data-action="resetBracket">Reset bracket</button></div>`}`;
if(tab==='Points')html=`<h2 class="heading">⭐ Manual points</h2><p class="muted">Independent of match results. Award or remove points in half-point increments.</p>${data.names.map((n,i)=>`<div class="card"><div class="flex between"><strong>${esc(n)}</strong><span class="big">${Number(data.points[i]).toFixed(1)}</span></div><div class="divider"></div><div class="flex wrap">${[-1,-.5,.5,1].map(v=>`<button class="${v>0?'primary':''}" data-action="points" data-person="${i}" data-delta="${v}">${v>0?'+':''}${v}</button>`).join('')}</div></div>`).join('')}`;
if(tab==='Stats'){let ms=matches(),sum=ms.reduce((s,m)=>s+m.hs+m.as,0),high=[...ms].sort((a,b)=>(b.hs+b.as)-(a.hs+a.as))[0],margin=[...ms].sort((a,b)=>Math.abs(b.hs-b.as)-Math.abs(a.hs-a.as))[0];const result=m=>m?`${esc(T(m.home)?.name||'?')} ${m.hs}–${m.as} ${esc(T(m.away)?.name||'?')}`:'No completed matches';html=`<h2 class="heading">📊 Tournament stats</h2><div class="grid">${[['Matches played',ms.length],['Total goals',sum],['Goals per game',ms.length?(sum/ms.length).toFixed(2):'0'],['Clubs',data.teams.length]].map(([n,v])=>`<div class="card"><div class="big">${v}</div><div class="muted small">${n}</div></div>`).join('')}</div><div class="card"><h3>🔥 Highest-scoring match</h3><p>${result(high)}</p></div><div class="card"><h3>⚡ Biggest victory</h3><p>${result(margin)}</p></div>`}
if(tab==='Settings')html=`<h2 class="heading">Settings & backup</h2><div class="card">${data.names.map((n,i)=>`<label>Player ${i+1}</label><input data-name="${i}" value="${esc(n)}" style="margin-bottom:12px">`).join('')}</div><div class="card"><h3>💾 Protect your results</h3><p class="muted">Results save in this browser on this device. They do not automatically sync between phones. Export a backup periodically.</p><div class="flex wrap"><button class="primary" data-action="export">Export JSON</button><button data-action="import">Import JSON</button></div></div><div class="card"><h3>Danger zone</h3><button class="danger" data-action="resetAll">Delete all tournament data</button></div>`;main.innerHTML=html}
function parseScore(k){let a=document.querySelector(`[data-hs="${k}"]`).value.trim(),b=document.querySelector(`[data-as="${k}"]`).value.trim();if(a===''&&b==='')return {hs:null,as:null};if(a===''||b===''||!/^\d+$/.test(a)||!/^\d+$/.test(b)||!Number.isSafeInteger(+a)||!Number.isSafeInteger(+b))throw Error('Enter two valid nonnegative whole-number scores, or leave both blank.');return {hs:+a,as:+b}}
function addNames(raw){let count=0;for(let name of raw.split(/[\n,]+/).map(s=>s.trim())){if(!name||data.teams.length>=64||data.teams.some(t=>t.name.toLowerCase()===name.toLowerCase()))continue;data.teams.push({id:data.nextId++,name,owner:-1,logo:''});count++}return count}
async function action(el){let a=el.dataset.action;try{if(a==='searchClubs'){let q=document.querySelector('#clubSearch')?.value.trim();if(!q)throw Error('Enter a club name.');el.disabled=true;el.textContent='Searching…';try{let response=await fetch('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t='+encodeURIComponent(q));if(!response.ok)throw Error('Club search temporarily unavailable');let obj=await response.json();clubResults=(obj.teams||[]).filter(x=>x.strTeam).slice(0,12).map(x=>({name:x.strTeam,country:x.strCountry||'',logo:x.strBadge||x.strLogo||''}));render();if(!clubResults.length)alert('No matching clubs. Try a different spelling or add manually.')}catch(e){render();alert('Club search unavailable right now. You can still add teams manually.')}return}if(a==='selectClub'){let c=clubResults[+el.dataset.index];if(!c)throw Error('Club not found.');if(data.teams.length>=64)throw Error('64-team limit reached.');if(data.teams.some(t=>t.name.toLowerCase()===c.name.toLowerCase()))throw Error('Club already added.');data.teams.push({id:data.nextId++,name:c.name,owner:-1,logo:c.logo});persist();render();return}if(a==='addTeam'||a==='bulkTeams'){let n=addNames(document.querySelector(a==='addTeam'?'#newTeam':'#bulkTeams').value);if(!n)throw Error('No new teams added. Check duplicates or the 64-team limit.')}
else if(a==='deleteTeam'){let id=+el.dataset.id;if(data.fixtures.some(m=>m.home===id||m.away===id)||(data.bracket&&data.bracket.flat().some(m=>m.home===id||m.away===id)))throw Error('This team is used in a match. Remove the fixture or reset the bracket first.');if(!confirm('Delete this team?'))return;data.teams=data.teams.filter(t=>t.id!==id)}
else if(a==='addFixture'){let h=+document.querySelector('#fixtureHome').value,w=+document.querySelector('#fixtureAway').value;if(!T(h)||!T(w)||h===w)throw Error('Choose two different teams.');data.fixtures.push({id:data.nextId++,home:h,away:w,hs:null,as:null})}
else if(a==='deleteFixture'){if(!confirm('Delete this fixture?'))return;data.fixtures=data.fixtures.filter(m=>m.id!==+el.dataset.id)}
else if(a==='saveMatch'){let knockout=el.dataset.mode==='knockout',r=+el.dataset.round,i=+el.dataset.index,m=knockout?data.bracket[r][i]:data.fixtures.find(m=>m.id===+el.dataset.id),k=knockout?`k-${r}-${i}`:`f-${m.id}`,h=m.home,w=m.away;if(!knockout||r===0){h=+document.querySelector(`[data-home="${k}"]`).value;w=+document.querySelector(`[data-away="${k}"]`).value}if(!T(h)||!T(w)||h===w)throw Error('Choose two different teams.');if(knockout&&r===0&&data.bracket[0].some((other,j)=>j!==i&&[other.home,other.away].some(id=>id===h||id===w)))throw Error('A team can only appear once in the Round of 64. Swap both matchups before saving, or reset the bracket.');let scores=parseScore(k),pen=null;if(knockout&&scores.hs!==null){let pv=document.querySelector(`[data-pen="${k}"]`).value;if(scores.hs===scores.as){if(pv==='')throw Error('Select the penalty winner for a tied knockout match.');pen=+pv}}Object.assign(m,{home:h,away:w,...scores,...(knockout?{penalty:pen}:{})});if(knockout)propagate();if(persist()){render();alert('Result saved successfully.')}return}
else if(a==='createBracket'){if(data.teams.length!==64)throw Error('You need exactly 64 teams.');data.bracket=[32,16,8,4,2,1].map((n,r)=>Array.from({length:n},(_,i)=>({home:r?null:data.teams[i*2].id,away:r?null:data.teams[i*2+1].id,hs:null,as:null,penalty:null})));round=0}
else if(a==='resetBracket'){if(!confirm('Delete all knockout results and recreate the bracket later?'))return;data.bracket=null;round=0}
else if(a==='points'){let i=+el.dataset.person;data.points[i]=Math.round((Number(data.points[i])+(+el.dataset.delta))*2)/2}
else if(a==='resetAll'){if(!confirm('Permanently delete all local tournament data?'))return;data=initial()}
else if(a==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='rivalry-fc-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
